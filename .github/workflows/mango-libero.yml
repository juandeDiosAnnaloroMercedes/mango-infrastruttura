name: Mango - correggi pulsante pubblicazione

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correggi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi invio righe libere
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("docs/index.html")
          s = p.read_text(encoding="utf-8")

          old = "const line=guidedMatch(raw)||raw;"
          new = "const line=raw;"
          if old in s:
              s = s.replace(old,new,1)
          elif new not in s:
              raise SystemExit("Codice di invio non trovato")

          old = "document.getElementById('btnProponi').disabled=!match||personalBusy;"
          new = "document.getElementById('btnProponi').disabled=!line.trim()||personalBusy;"
          s = s.replace(old,new)

          p.write_text(s,encoding="utf-8")
          print("Pulsante configurato per testi liberi")
          PY
      - name: Verifica
        run: |
          git diff --check
          grep -q "const line=raw;" docs/index.html
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Mango: pulsante righe libere"
            git push
          fi
  
